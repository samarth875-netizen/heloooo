<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rocket STL Viewer</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0e14; color: #e6e6e6; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  canvas { display: block; }
  .panel {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(17,22,32,.88); border: 1px solid #2a3446; border-radius: 14px;
    padding: 14px 16px; width: 300px; backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .panel h1 { font-size: 16px; margin: 0 0 4px; }
  .panel p.sub { font-size: 12px; color: #9aa7bd; margin: 0 0 12px; line-height: 1.5; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  button, label.btn {
    background: #1f6feb; border: 0; color: white; padding: 8px 10px; border-radius: 9px;
    font-size: 13px; cursor: pointer; flex: 1; text-align: center; white-space: nowrap;
  }
  button.secondary { background: #212c3f; border: 1px solid #33405a; }
  button:hover, label.btn:hover { filter: brightness(1.15); }
  .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; color: #c4cfdf; margin: 8px 0; }
  .controls-grid label { display: flex; align-items: center; gap: 6px; background: #141b29; padding: 7px 9px; border-radius: 9px; border: 1px solid #26314a; }
  input[type="color"] { width: 100%; height: 32px; border: 0; background: none; padding: 0; cursor: pointer; }
  #info { font-size: 12px; color: #9aa7bd; background: #0f1522; border: 1px solid #233049; border-radius: 9px; padding: 8px 10px; min-height: 54px; }
  #status { margin-top: 8px; font-size: 12px; color: #7ee2a8; }
  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(0,0,0,.6); border: 1px solid #2a3446; padding: 8px 14px; border-radius: 999px;
    font-size: 12px; color: #aab6cb;
  }
  #drop {
    position: fixed; inset: 0; z-index: 20; display: none; place-items: center;
    background: rgba(31,111,235,.15); border: 3px dashed #1f6feb; font-size: 20px;
  }
  input[type="file"] { display: none; }
  @media (max-width: 600px) { .panel { width: calc(100% - 32px); } #hint { display: none; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="scene"></div>

<div class="panel">
  <h1>🚀 STL Viewer — Rocket + Cyber</h1>
  <p class="sub">Drag to rotate • Scroll to zoom • Right-drag to pan</p>
  <div class="row">
    <button id="m-rocket">🚀 Rocket</button>
    <button id="m-cyber" class="secondary">🤖 Cyber</button>
  </div>
  <div class="row">
    <label class="btn" for="file">Open STL</label>
    <button id="reset" class="secondary">Reset view</button>
  </div>
  <input type="file" id="file" accept=".stl" />
  <div class="controls-grid">
    <label><input type="checkbox" id="wire" /> Wireframe</label>
    <label><input type="checkbox" id="spin" checked /> Auto-rotate</label>
    <label><input type="checkbox" id="grid" checked /> Grid</label>
    <label><input type="checkbox" id="flat" /> Flat shade</label>
  </div>
  <div class="row" style="align-items:center">
    <div style="flex:1">
      <div style="font-size:12px;margin-bottom:4px;color:#9aa7bd">Model color</div>
      <input type="color" id="color" value="#ff5a3c" />
    </div>
    <div style="flex:1">
      <div style="font-size:12px;margin-bottom:4px;color:#9aa7bd">Background</div>
      <input type="color" id="bg" value="#0b0e14" />
    </div>
  </div>
  <div id="info">Loading rocket.stl…</div>
  <div id="status"></div>
</div>

<div id="hint">Left-drag: rotate &nbsp; • &nbsp; Wheel: zoom &nbsp; • &nbsp; Right-drag: pan &nbsp; • &nbsp; Drop any .stl to view</div>
<div id="drop">Drop .stl file to view</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const container = document.getElementById('scene');
const infoEl = document.getElementById('info');
const statusEl = document.getElementById('status');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.001, 1000);
camera.position.set(0.08, 0.05, 0.12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;

scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(5, 8, 5);
key.castShadow = true;
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.7);
fill.position.set(-5, 3, -5);
scene.add(fill);

const grid = new THREE.GridHelper(1, 20, 0x2a3446, 0x1a2334);
grid.position.y = -0.03;
scene.add(grid);

let mesh = null;
const loader = new STLLoader();
const mat = new THREE.MeshStandardMaterial({
  color: 0xff5a3c, metalness: 0.25, roughness: 0.45,
  side: THREE.DoubleSide
});

function showMesh(geometry, name) {
  if (mesh) { scene.remove(mesh); geometry && mesh.geometry.dispose(); }
  geometry.computeVertexNormals();
  // center
  geometry.computeBoundingBox();
  const bb = geometry.boundingBox;
  const center = bb.getCenter(new THREE.Vector3());
  geometry.translate(-center.x, -center.y, -center.z);
  geometry.computeBoundingSphere();
  const size = bb.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);

  mesh = new THREE.Mesh(geometry, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  // scale grid to model + fit camera
  const s = maxDim > 0 ? maxDim : 0.1;
  grid.scale.setScalar(Math.max(1, s * 8));
  fitCamera(s);

  const tris = geometry.index ? geometry.index.count/3 : geometry.attributes.position.count/3;
  infoEl.innerHTML =
    `<b>${name}</b><br>` +
    `Triangles: ${Math.round(tris).toLocaleString()}<br>` +
    `Size: ${size.x.toFixed(3)} × ${size.y.toFixed(3)} × ${size.z.toFixed(3)}`;
  statusEl.textContent = '✓ loaded — drag to move it';
}

function fitCamera(maxDim) {
  const d = maxDim * 2.2;
  camera.position.set(d*0.7, d*0.45, d*0.9);
  controls.target.set(0,0,0);
  controls.update();
}

function loadFromBuffer(buf, name) {
  try {
    const geom = loader.parse(buf);
    showMesh(geom, name);
  } catch(e) {
    console.error(e);
    infoEl.textContent = 'Failed to parse STL: ' + e.message;
  }
}

async function loadModel(name) {
  infoEl.innerHTML = `Loading ${name}…`;
  statusEl.textContent = '';
  setActiveModel(name);
  try {
    const res = await fetch(name);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const buf = await res.arrayBuffer();
    loadFromBuffer(buf, name);
  } catch(e) {
    console.warn(e);
    infoEl.innerHTML = `<b>No auto-load</b><br>Click “Open STL” or drag <b>${name}</b> here.<br><span style="color:#667">(${e.message} — this happens on file://, use Start Viewer)</span>`;
    statusEl.textContent = '';
  }
}

function setActiveModel(name) {
  const br = document.getElementById('m-rocket');
  const bc = document.getElementById('m-cyber');
  if (!br || !bc) return;
  br.className = name === 'cyber.stl' ? 'secondary' : '';
  bc.className = name === 'cyber.stl' ? '' : 'secondary';
}

function loadDefault() {
  const q = new URLSearchParams(location.search).get('model');
  loadModel(q === 'cyber.stl' ? 'cyber.stl' : 'rocket.stl');
}

// UI
document.getElementById('m-rocket').addEventListener('click', () => loadModel('rocket.stl'));
document.getElementById('m-cyber').addEventListener('click', () => loadModel('cyber.stl'));
document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => loadFromBuffer(r.result, f.name);
  r.readAsArrayBuffer(f);
});
document.getElementById('wire').addEventListener('change', e => mat.wireframe = e.target.checked);
document.getElementById('spin').addEventListener('change', e => controls.autoRotate = e.target.checked);
document.getElementById('grid').addEventListener('change', e => grid.visible = e.target.checked);
document.getElementById('flat').addEventListener('change', e => { mat.flatShading = e.target.checked; mat.needsUpdate = true; });
document.getElementById('color').addEventListener('input', e => mat.color.set(e.target.value));
document.getElementById('bg').addEventListener('input', e => {
  scene.background.set(e.target.value);
  document.body.style.background = e.target.value;
});
document.getElementById('reset').addEventListener('click', () => {
  if (!mesh) return;
  const s = mesh.geometry.boundingSphere.radius * 2;
  fitCamera(s);
});

// drag & drop
const drop = document.getElementById('drop');
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; drop.style.display='grid'; });
addEventListener('dragleave', e => { e.preventDefault(); if(--dragDepth<=0){dragDepth=0; drop.style.display='none';} });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); dragDepth=0; drop.style.display='none';
  const f = e.dataTransfer.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => loadFromBuffer(r.result, f.name);
  r.readAsArrayBuffer(f);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();

loadDefault();
</script>
</body>
</html>
